# Taxonomy for the synthetic fashion catalogue.
# category -> subcategories. Each subcategory defines the attribute pools used
# by the product generator. All generation vocabulary lives here so the
# generator code stays free of magic strings.

meta:
  version: 1
  categories_distribution:        # target shares; enforced exactly at write time
    men: 0.30
    women: 0.35
    kids: 0.20
    accessories: 0.15

shared:
  occasions: [casual, formal, party, wedding, office, sports, festive]
  seasons: [spring, summer, monsoon, autumn, winter, all_season]
  fits: [slim, regular, relaxed, oversized]
  stock_status_weights: {in_stock: 0.82, low_stock: 0.10, out_of_stock: 0.06, preorder: 0.02}
  care_by_fabric:
    cotton: "Machine wash cold, tumble dry low. Do not bleach."
    polyester: "Machine wash warm, hang to dry. Iron on low heat if needed."
    silk: "Dry clean only. Store away from direct sunlight."
    wool: "Dry clean recommended. Hand wash in cold water with mild detergent."
    linen: "Machine wash gentle, line dry. Iron while damp for best results."
    denim: "Machine wash cold inside out. Hang dry to preserve colour."
    leather: "Wipe with a damp cloth and condition every few months."
    synthetic_leather: "Wipe clean with a soft damp cloth. Avoid direct heat."
    georgette: "Hand wash separately in cold water. Do not wring."
    chiffon: "Dry clean preferred. Steam on low heat only."
    khadi: "Hand wash in lukewarm water, dry in shade."
    viscose: "Hand wash cold or machine wash gentle. Lay flat to dry."
    nylon: "Machine wash cold with like colours. Tumble dry low."
    canvas: "Spot clean with mild soap; air dry away from sun."
    jute_blend: "Spot clean only. Keep in a dry, ventilated place."
    modal: "Machine wash cold, tumble dry low. Resists shrinking."
    bamboo_rayon: "Machine wash gentle in cold water. Hang to dry."
    fleece: "Machine wash cold, tumble dry low. Do not iron."
    satin: "Hand wash cold, hang to dry. Iron on reverse side, low heat."
    velvet: "Dry clean only. Brush nap gently after wearing."
    blend: "Machine wash cold with like colours. Tumble dry low."
    mixed: "Refer to the label inside the garment for washing instructions."

