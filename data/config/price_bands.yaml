# Price model. MRP = subcategory base_price sampled uniformly, scaled by the
# brand tier multiplier and a per-product jitter. Selling price = MRP * (1 - discount).
# Bands are sanity ranges used by validators: any selling price outside the
# category band for its subcategory+tier fails validation.

rounding:
  mrp_endings: [0, 9, 49, 99, 95, 90]     # retail-style price endings
  max_discount_percent: 80
  min_discount_percent: 0
  discount_weights:                        # P(discount bucket) — many items barely discounted
    none_0_5: 0.22
    light_5_15: 0.30
    mid_15_40: 0.33
    heavy_40_80: 0.15

bands:                                     # [min, max] selling price in INR, per tier
  shirt:
    budget:   [300, 1600]
    mid:      [500, 2600]
    premium:  [1200, 6000]
